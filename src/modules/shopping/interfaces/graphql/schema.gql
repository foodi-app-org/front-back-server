type ShoppingCart {
  shoppingCartId: ID
  # start
  id: ID
  pId: ID
  shoppingCartRefCode: String
  priceProduct: Float
  comments: String
  cantProducts: Int
  refCodePid: String
  # end
  idUser: ID
  idStore: ID
  sState: Int
  createdAt: DateTime
  updatedAt: DateTime
  getStore: Store
  products: ProductFood
  # salesExtProductFoodOptional: [saleExtProductFoodOptional]
  # ExtProductFoodsAll: [ExtProductFood]
}

input ExtProductFoodSubOptionalInput {
  pId: String
  opExPid: String
  idStore: String
  opSubExPid: String
  OptionalSubProName: String
  exCodeOptionExtra: String
  exCode: String
  state: Int
  createdAt: String
  updatedAt: String
  check: Boolean
}

input ExtProductFoodOptionalInput {
  pId: String
  opExPid: String
  OptionalProName: String
  state: Int
  code: String
  numbersOptionalOnly: Int
  createdAt: String
  required: Int
  updatedAt: String
  ExtProductFoodsSubOptionalAll: [ExtProductFoodSubOptionalInput]
}

input ExtProductFoodInput {
  pId: String
  exPid: String
  exState: Int
  extraName: String
  extraPrice: Float
  state: Int
  createdAt: String
  updatedAt: String
  quantity: Int
  newExtraPrice: Float
  # Inventory flags for complementos (extras). A complemento manages its own
  # stock independently from the parent product. These fields reflect the extra
  # catalog state sent from the POS; the actual inventory decrement is driven by
  # the backend using the extra's exPid (see registerSalesStore / ExtraStock).
  # They are optional so historical sales and extras without stock keep working.
  manageStock: Boolean
  stock: Int
}


input IShoppingCart {
  shoppingCartId: ID
  id: ID
  pId: ID
  shoppingCartRefCode: String
  idUser: ID
  idStore: ID
  comments: String
  ProPrice: Float # quitar
  totalExtra: Float # quitar
  cantProducts: Int
  priceProduct: Float
  refCodePid: String
  # Marca el producto como cortesía/gratis. Cuando es true el backend fuerza el
  # precio de la línea a 0 (producto y complementos) para que NO sume en
  # contaduría, reportes, venta del día ni venta general de la tienda, sin
  # importar el ProPrice/priceProduct real enviado desde el POS.
  free: Boolean
  sState: Int
  createdAt: DateTime
  updatedAt: DateTime
  dataExtra: [ExtProductFoodInput]
  dataOptional: [ExtProductFoodOptionalInput]
}


type ResponseShoppingCart {
  success: Boolean
  message: String
  errors: [errors]
  data: ShoppingCart
}


# ShoppingCart Input
input IID_SUB {
  _id: ID
}

input IID_SUB_ITEMS {
  setID: [IID_SUB]
}


# Query
type Query {
  getAllShoppingCart: [ShoppingCart]
}