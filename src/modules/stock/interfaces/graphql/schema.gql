type StockUpdatedByIdPayload {
  pId: String!
  newStock: Int!
  previousStock: Int!
  event: String!
  meta: JSON
}

type ProductMovement {
  productName: String!
  totalMovements: Int!
  idProduct: ID
}

type TotalSalesResult {
  success: Boolean!
  message: String!
  totalSales: Float
}

type StockMovementSummary {
  date: String
  total_in: Int
  total_out: Int
  total_adjustment: Int
}

type WeeklyStockChange {
  weekStart: String
  totalOut: Int
  prevTotalOut: Int
  percentageChange: Float
}

input InputManageStock {
  pId: ID
  manageStock: Boolean
}

input InputRestockProduct {
  pId: ID
  "Target absolute stock. Only increases are applied (RESTOCK of the delta); it never lowers existing stock."
  stock: Int
}

type ManageStockProduct {
  pId: ID
  manageStock: Boolean
  stock: Int
  previousStock: Int
}

type ResponseManageStock {
  success: Boolean
  message: String
  data: ManageStockProduct
}

type Query {
  getTopProductsMovements: [ProductMovement]
  totalSales: TotalSalesResult!
  getTotalSalesSold: Int!
  getTotalProductsSold: Int!
  getTotalProductsInStock: Int!
  getStockMovementsByDay(filter: DashboardFilterInput): [StockMovementSummary!]!
  getStockMovementWeeklyComparison: [WeeklyStockChange]
}

type Mutation {
  "Enable/disable inventory control for a main product."
  updateManageStock(input: InputManageStock): ResponseManageStock
  "Increase a main product's stock to a target as an inventory ENTRY (RESTOCK). Never lowers existing stock."
  restockProduct(input: InputRestockProduct): ResponseManageStock
}

type Subscription {
  StockUpdatedById(pId: String): StockUpdatedByIdPayload!
  StockUpdatedAll(idStore: String): StockUpdatedByIdPayload
}
