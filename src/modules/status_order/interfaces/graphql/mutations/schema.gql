enum typeDiscount {
  PERCENT
  AMOUNT
}

input DiscountInput {
  type: typeDiscount
  value: Int
}

type Mutation {
  registerSalesStore(
    input: [IShoppingCart]
    id: ID
    tableId: ID
    discount: DiscountInput
    idStore: ID
    pCodeRef: String
    change: Float
    shoppingCartRefCode: String
    payId: ID
    pickUp: Int
    totalProductsPrice: Float
    valueDelivery: Float
    delivery: QuoteSaleDeliveryInput
    expectedCheckoutTotal: String
    idSubArray: IID_SUB_ITEMS

    # Cash Management & Payments
    cashSessionId: ID
    paymentInput: SalePaymentInput
  ): ResponseSalesStore

  deleteOneItem(
    cState: Int
    ShoppingCart: ID
  ): Response

  createOrder(
    id: String!
    idStore: String!
    pdpId: String!
    totalProductsPrice: Int!
    unidProducts: Int!
  ): OrderPapu
}