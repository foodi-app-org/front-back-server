type OrderTotals {
  key: String
  name: String
  value: String
}

# Stores
type StoreOrders {
  pdpId: ID
  id: ID
  idStore: ID
  ppState: Int
  channel: Int
  change: Int
  pCodeRef: String
  status: String
  pSState: ID
  payId: ID
  totalProductsPrice: Float
  # Structured discount + net income (accounting source of truth).
  # discountType: 'PERCENT' | 'AMOUNT' at sale time.
  # discountValue: user-entered figure (percent 0-100 or money amount).
  # discountAmount: money actually discounted.
  # netTotal: totalProductsPrice (gross) - discountAmount.
  discountType: String
  discountValue: Int
  discountAmount: Float
  netTotal: Float
  unidProducts: Int
  createdAt: DateTime
  updatedAt: DateTime
  pDatCre: DateTime
  pDatMod: DateTime
  getUser: User
  shoppingCartRefCode: String
  locationUser: String
  date: DateTime
  store: Store
  shoppingCarts: [ShoppingCart]
  client: Clients
  getOneStore: Store
  totals: [OrderTotals]
  statusOrder: OrderStatusType
  paymentMethod: PaymentMethod
}
type OrderPapu {
  id: String
  idStore: String
  pdpId: String
  totalProductsPrice: Int
  unidProducts: Int
}

type ResponseSalesStore {
  success: Boolean
  message: String
  errors: [errors]
  data: StoreOrders
}

type Query {
  getOneSalesStore(pCodeRef: String): ResponseSalesStore
  getAllSalesStore(idStore: ID, pId: ID, cId: ID, dId: ID, ctId: ID, search: String, min: Int, max: Int, fromDate: String, toDate: String, channel: Int): [StoreOrders]
}
