
# Mutations
type Mutation {
  "Registra un productFood"
  updateProductFoods(input: InputProductFood): ResponseProduct
  updateMultipleProducts(input: [InputProductFood]): [ResponseProduct]
  "edita un productFoodo"
  editProductFoods(input: InputProductFood): Response
  "Borra un productFoodo"
  deleteProductFoods(input: IDeleteProductFood): ProductFood
  "Asocia un tag existente a un producto"
  registerTagToProduct(pId: ID!, tgId: ID!): ResponseProduct
  "Actualiza la categoría (carProId) de un producto"
  updateProductCategory(pId: ID!, carProId: ID!): ResponseProduct
  "Actualiza el status de un producto"
  updateStatusProduct(pId: ID!, pState: Int): ResponseProduct

}
