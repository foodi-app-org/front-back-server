enum SaleRefundScope { FULL_REMAINING SELECTED }
enum SaleRefundDisposition { RESTOCK DAMAGED NO_STOCK }
enum SaleRefundStatus { PENDING_EXTERNAL COMPLETED CANCELLED }
input SaleRefundLineInput {
  shoppingCartId: ID!
  quantity: Int!
  disposition: SaleRefundDisposition!
}
input RequestSaleRefundInput {
  saleReference: String!
  scope: SaleRefundScope!
  defaultDisposition: SaleRefundDisposition
  items: [SaleRefundLineInput!]
  cashSessionId: ID
  reason: String!
  idempotencyKey: String!
}
input ConfirmExternalSaleRefundInput {
  refundId: ID!
  externalReference: String!
  externallyVerified: Boolean!
  idempotencyKey: String!
}
input CancelSaleRefundInput {
  refundId: ID!
  reason: String!
  idempotencyKey: String!
}
type SaleRefundItemView {
  id: ID!
  shoppingCartId: ID!
  quantity: Int!
  amountMinor: String!
  disposition: SaleRefundDisposition!
}
type SaleRefundView {
  id: ID!
  saleId: ID!
  saleReference: String!
  originalPaymentId: ID!
  cashSessionId: ID
  status: SaleRefundStatus!
  scope: SaleRefundScope!
  amountMinor: String!
  reason: String!
  requestedBy: ID!
  requestedAt: String!
  confirmedBy: ID
  confirmedAt: String
  paymentId: ID
  externalReference: String
  cancelReason: String
  cancelledBy: ID
  cancelledAt: String
  items: [SaleRefundItemView!]!
}
type SaleRefundPreviewLine {
  shoppingCartId: ID!
  productName: String!
  soldQuantity: Int!
  alreadyReservedQuantity: Int!
  remainingQuantity: Int!
  allocatedMinor: String!
}
type SaleRefundPreview {
  saleReference: String!
  saleId: ID!
  paymentKind: FinancialPaymentKind!
  merchandiseNetMinor: String!
  refundableMerchandiseMinor: String!
  lines: [SaleRefundPreviewLine!]!
}
extend type Query {
  getSaleRefundPreview(saleReference: String!): SaleRefundPreview!
  getSaleRefunds(saleReference: String!): [SaleRefundView!]!
}
extend type Mutation {
  requestSaleRefund(input: RequestSaleRefundInput!): SaleRefundView!
  confirmExternalSaleRefund(input: ConfirmExternalSaleRefundInput!): SaleRefundView!
  cancelSaleRefund(input: CancelSaleRefundInput!): SaleRefundView!
}

# Read-only audit. Amounts in minor units (centésimas COP), not GraphQL Float.
type SaleRefundKardexAmount { key: String! delta: Int! }
type SaleRefundKardexAudit {
  refundId: ID!
  verified: Boolean!
  issues: [String!]!
  expected: [SaleRefundKardexAmount!]!
  actual: [SaleRefundKardexAmount!]!
}
type SaleRefundStockExtra {
  catalogId: ID!
  name: String!
  soldQuantity: Int!
  expectedRestockedQuantity: Int!
  restockedQuantity: Int!
  wasRestocked: Boolean!
  restockVerified: Boolean!
  currentStock: Int
  manageStock: Boolean
}
type SaleRefundAccountingLine {
  shoppingCartId: ID!
  soldProductId: ID!
  catalogProductId: ID!
  productName: String!
  soldQuantity: Int!
  returnedQuantity: Int!
  reservedQuantity: Int!
  remainingQuantity: Int!
  expectedRestockedQuantity: Int!
  restockedQuantity: Int!
  wasRestocked: Boolean!
  restockVerified: Boolean!
  currentStock: Int
  manageStock: Boolean
  extras: [SaleRefundStockExtra!]!
}
type SaleRefundAccounting {
  commercialStatus: String!
  saleId: ID!
  saleReference: String!
  originalGrossMinor: String
  originalMerchandiseMinor: String!
  confirmedRefundMinor: String!
  pendingRefundMinor: String!
  cancelledRefundMinor: String!
  effectiveMerchandiseMinor: String!
  confirmedRefundCount: Int!
  pendingRefundCount: Int!
  cancelledRefundCount: Int!
  verified: Boolean!
  issues: [String!]!
  stockIssues: [String!]!
  kardexVerified: Boolean!
  kardexAudits: [SaleRefundKardexAudit!]!
  lines: [SaleRefundAccountingLine!]!
}
type RefundSettlementAudit {
  refundId: ID!
  saleId: ID!
  saleReference: String!
  requestedAt: String!
  confirmedAt: String!
  amountMinor: String!
  paymentKind: String!
  paymentId: ID
  accountingVerified: Boolean!
  providerVerified: Boolean!
  issues: [String!]!
}
type RefundSettlementSummary {
  confirmedVerifiedMinor: String!
  excludedUnverifiedMinor: String!
  confirmedCount: Int!
  unverifiedCount: Int!
}
type RefundSettlementLedger {
  from: String!
  to: String!
  timezone: String!
  currency: String!
  summary: RefundSettlementSummary!
  rows: [RefundSettlementAudit!]!
}
extend type Query {
  getSaleRefundKardexAudit(refundId: ID!): SaleRefundKardexAudit!
  getSaleRefundAccounting(saleReference: String!): SaleRefundAccounting!
  getRefundSettlementLedger(from: String!, to: String!): RefundSettlementLedger!
}

# Read-only projection, requested only when order query includes refundSummary.
# Historical statusOrder remains CONCLUIDA and snapshots are immutable.
extend type StoreOrders {
  refundSummary: SaleRefundAccounting
}
