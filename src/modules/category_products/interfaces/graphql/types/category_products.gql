# Existing queries/types remain unchanged. New endpoint is additive.
type catProducts {
  carProId: ID
  idStore: ID
  pName: String
  ProDescription: String
  ProImage: String
  pState: Int
  createdAt: DateTime
  updatedAt: DateTime
}

type catProductsWithProduct {
  carProId: ID
  idStore: ID
  pName: String
  totalCount: Int
  ProDescription: String
  ProImage: String
  pState: Int
  createdAt: DateTime
  updatedAt: DateTime
  productFoodsAll: [ProductFood]
}

type customTotalAndCatProductsWithProduct {
  totalCount: Int
  catProductsWithProduct: [catProductsWithProduct]
}

input InputCatProducts {
  carProId: ID
  idStore: ID
  pName: String
  ProDescription: String
  ProImage: String
  pState: Int
  createdAt: DateTime
  updatedAt: DateTime
}

input ILineItemsIds { idProduct: ID }
input LineItemsIdPro { setData: [ILineItemsIds] idCat: ID }
type ResponseCategoryProduct { success: Boolean message: String errors: [errors] }

# Use unique names to avoid duplicate types defined by the product module.
type CategoryPaginationMeta {
  totalRecords: Int!
  totalPages: Int!
  currentPage: Int!
  pageSize: Int!
  mode: String!
}

type CategoryProductsPaginatedResult {
  success: Boolean!
  message: String!
  data: [catProducts!]!
  pagination: CategoryPaginationMeta!
  nextCursor: String
}

type Query {
  getcatProducts: [catProducts]
  catProducts: [catProducts]
  catProductsOne(carProId: ID, cId: ID, dId: ID, ctId: ID): catProducts
  catProductsAll(
    carProId: ID
    cId: ID
    dId: ID
    ctId: ID
    search: String
    min: Int
    max: Int
    gender: [String]
    desc: [String]
    categories: [ID]
  ): [catProducts]

  "Paginated category list scoped to the current context.restaurant tenant"
  catProductsPaginated(
    page: Int = 1
    max: Int = 20
    search: String
    pState: Int
    mode: String = "offset"
    cursor: String
  ): CategoryProductsPaginatedResult!

  getCatProductsWithProduct(
    carProId: ID
    cId: ID
    dId: ID
    ctId: ID
    productName: String
    search: String
    min: Int
    max: Int
    gender: [String]
    desc: [String]
    categories: [ID]
  ): customTotalAndCatProductsWithProduct

  getCatProductsWithProductClient(
    carProId: ID
    cId: ID
    dId: ID
    ctId: ID
    search: String
    min: Int
    max: Int
    gender: [String]
    desc: [String]
    categories: [ID]
    idStore: ID
  ): [catProductsWithProduct]

  catProductsLogis(carProId: ID, cId: ID, dId: ID, ctId: ID, search: String, min: Int, max: Int): [catProducts]
}
