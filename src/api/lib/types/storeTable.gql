enum TableState {
  UNAVAILABLE
  ACTIVE
  OCCUPIED
}

type StoreTable {
  tableId: ID!
  tableName: String!
  seats: Int!
  section: String!
  tableState: TableState!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type TableResponse {
  success: Boolean!
  message: String!
  errors: [errors]
  data: StoreTable
}

type Query {
  storeTables: [StoreTable!]!
  storeTable(tableId: ID!): StoreTable
}

type Mutation {
  storeTableCreate(
    tableName: String!
    seats: Int!
    section: String!
    tableState: TableState
  ): TableResponse!

  updateStoreTable(
    tableId: ID!
    tableName: String
    seats: Int
    section: String
    tableState: TableState
  ): TableResponse!
}