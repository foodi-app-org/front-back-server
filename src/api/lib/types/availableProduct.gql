

type AvailableProduct {
    availableProductId: ID
    idStore: ID
    pId: ID
    dayAvailable: Int
    startDate: String
    endDate: String
    state: Int
    pDatCre: DateTime
    pDatMod: DateTime
    createdAt: DateTime
    updatedAt: DateTime
}
# Account Type

# Account Input
input IAvailableProduct {
    availableProductId: ID
    idStore: ID
    pId: ID
    dayAvailable: Int
    startDate: String
    endDate: String
    state: Int
    pDatCre: DateTime
    pDatMod: DateTime
    createdAt: DateTime
    updatedAt: DateTime
}

# Query
type Query {
  getAllAvailableProduct(pId: ID): [AvailableProduct]
}
# Mutations
type Mutation {
  registerAvailableProduct(input: [IAvailableProduct]): Response
  editAvailableProduct(pId: ID): Boolean,
}
